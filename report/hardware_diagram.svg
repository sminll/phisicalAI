<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0b1220; }
    .panel { fill: #0f1a2b; stroke: #1e2b40; }
    .title { fill: #e2e8f0; font-size: 15px; font-weight: 800; letter-spacing: .08em; }
    .sub { fill: #64748b; font-size: 12px; }
    .node { fill: #111c2e; stroke-width: 2; }
    .pwr { stroke: #f59e0b; }
    .cpu { stroke: #2dd4bf; }
    .act { stroke: #a78bfa; }
    .ext { stroke: #64748b; }
    .name { fill: #f8fafc; font-size: 16px; font-weight: 800; text-anchor: middle; }
    .desc { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
    .pline { fill: none; stroke: #d97706; stroke-width: 3; stroke-linejoin: round; opacity: .9; }
    .sline { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 7 5; }
    .lbl { font-size: 11.5px; font-weight: 700; }
    .lbl-s { fill: #5eead4; }
    .lbl-p { fill: #fbbf24; }
    .lblbg { fill: #0b1220; }
    .gnd { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .gndt { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
  </style>

  <rect class="bg" width="1000" height="680"/>
  <rect class="panel" x="16" y="56" width="968" height="608" rx="14"/>

  <!-- 제목 · 범례 -->
  <text class="title" x="24" y="34">ECOSORT AI · 하드웨어 시스템 구성도</text>
  <line x1="700" y1="30" x2="730" y2="30" stroke="#d97706" stroke-width="3"/>
  <text class="sub" x="738" y="34">전원 · 전류</text>
  <line x1="830" y1="30" x2="860" y2="30" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="sub" x="868" y="34">신호 · 데이터</text>

  <!-- ===== 전원선 ===== -->
  <!-- 콘센트 → 5V-A / 5V-B -->
  <path class="pline" d="M180 330 H205 V140 H230"/>
  <path class="pline" d="M180 330 H205 V552 H230"/>
  <!-- 5V-A → Pi -->
  <path class="pline" d="M390 140 H440"/>
  <!-- 5V-B → 구동부 버스 -->
  <path class="pline" d="M390 552 H700"/>
  <path class="pline" d="M700 312 V602"/>
  <path class="pline" d="M700 312 H740"/>
  <path class="pline" d="M700 402 H740"/>
  <path class="pline" d="M700 492 H740"/>
  <path class="pline" d="M700 602 H740"/>

  <!-- ===== 신호선 ===== -->
  <!-- Pi ↔ 웹캠 -->
  <path class="sline" d="M640 120 C690 120 690 96 738 96" marker-start="url(#arrS)"/>
  <!-- Pi → 서버 -->
  <path class="sline" d="M640 160 C690 160 690 200 738 200" marker-end="url(#arrS)"/>
  <!-- Pi ↔ Arduino -->
  <path class="sline" d="M540 176 V416" marker-start="url(#arrS)" marker-end="url(#arrS)"/>
  <!-- Arduino → 서보 / LED -->
  <path class="sline" d="M640 432 C672 432 672 316 738 316" marker-end="url(#arrS)"/>
  <path class="sline" d="M640 446 C680 446 680 406 738 406" marker-end="url(#arrS)"/>
  <!-- 초음파 → Arduino -->
  <path class="sline" d="M738 496 C676 496 676 462 640 462" marker-end="url(#arrS)"/>

  <!-- ===== 신호선 라벨 ===== -->
  <rect class="lblbg" x="655" y="64" width="80" height="18" rx="4"/>
  <text class="lbl lbl-s" x="695" y="77" text-anchor="middle">USB 2.0 · UVC</text>
  <rect class="lblbg" x="648" y="196" width="86" height="18" rx="4"/>
  <text class="lbl lbl-s" x="691" y="209" text-anchor="middle">Wi-Fi · MQTT</text>
  <rect class="lblbg" x="552" y="262" width="134" height="40" rx="4"/>
  <text class="lbl lbl-s" x="558" y="278">USB 시리얼</text>
  <text class="lbl lbl-s" x="558" y="295">UART 115200bps</text>
  <text class="desc" x="470" y="282" style="text-anchor:end">D (감지) ↑</text>
  <text class="desc" x="470" y="300" style="text-anchor:end">↓ P · C · G · R · X</text>
  <rect class="lblbg" x="662" y="338" width="70" height="18" rx="4"/>
  <text class="lbl lbl-s" x="697" y="351" text-anchor="middle">PWM 50Hz</text>
  <rect class="lblbg" x="644" y="422" width="92" height="18" rx="4"/>
  <text class="lbl lbl-s" x="690" y="435" text-anchor="middle">단일선 800kHz</text>
  <rect class="lblbg" x="644" y="508" width="92" height="18" rx="4"/>
  <text class="lbl lbl-s" x="690" y="521" text-anchor="middle">Trig/Echo 펄스</text>

  <!-- ===== 전원선 라벨 ===== -->
  <text class="lbl lbl-p" x="396" y="132">5.1V 3A</text>
  <text class="lbl lbl-p" x="470" y="545">5V 구동부 전원 버스</text>

  <!-- ===== 노드 ===== -->
  <!-- 콘센트 -->
  <rect class="node ext" x="40" y="298" width="140" height="64" rx="10"/>
  <text class="name" x="110" y="326">AC 220V</text>
  <text class="desc" x="110" y="346">콘센트 (고정 설치)</text>

  <!-- 5V-A -->
  <rect class="node pwr" x="230" y="108" width="160" height="64" rx="10"/>
  <text class="name" x="310" y="136">어댑터 5.1V/3A</text>
  <text class="desc" x="310" y="156">5V-A · Pi 전용 USB-C</text>

  <!-- 5V-B -->
  <rect class="node pwr" x="230" y="520" width="160" height="64" rx="10"/>
  <text class="name" x="310" y="548">어댑터 5V/3A</text>
  <text class="desc" x="310" y="568">5V-B · 구동부 전용</text>

  <!-- Raspberry Pi -->
  <rect class="node cpu" x="440" y="104" width="200" height="72" rx="10"/>
  <text class="name" x="540" y="134">Raspberry Pi 4</text>
  <text class="desc" x="540" y="155">AI 추론 · 판단 (YOLO26n)</text>

  <!-- Arduino -->
  <rect class="node cpu" x="440" y="416" width="200" height="72" rx="10"/>
  <text class="name" x="540" y="446">Arduino Uno</text>
  <text class="desc" x="540" y="467">센서 · 실시간 제어</text>

  <!-- 웹캠 -->
  <rect class="node cpu" x="740" y="68" width="200" height="60" rx="10"/>
  <text class="name" x="840" y="94">USB 웹캠</text>
  <text class="desc" x="840" y="113">1280×720 · 30FPS</text>

  <!-- 서버 -->
  <rect class="node ext" x="740" y="172" width="200" height="60" rx="10"/>
  <text class="name" x="840" y="198">교내 관리 서버</text>
  <text class="desc" x="840" y="217">결과 텍스트만 · 사진 X</text>

  <!-- 서보 -->
  <rect class="node act" x="740" y="284" width="200" height="60" rx="10"/>
  <text class="name" x="840" y="310">서보 SG90 ×3</text>
  <text class="desc" x="840" y="329">투입구 뚜껑 개폐</text>

  <!-- LED -->
  <rect class="node act" x="740" y="374" width="200" height="60" rx="10"/>
  <text class="name" x="840" y="400">WS2812B LED ×3</text>
  <text class="desc" x="840" y="419">투입구 색 안내</text>

  <!-- 초음파 -->
  <rect class="node cpu" x="740" y="464" width="200" height="60" rx="10"/>
  <text class="name" x="840" y="490">초음파 HC-SR04 ×4</text>
  <text class="desc" x="840" y="509">접근 감지 1 · 적재량 3</text>

  <!-- 조명 -->
  <rect class="node act" x="740" y="574" width="200" height="56" rx="10"/>
  <text class="name" x="840" y="598">보조 조명</text>
  <text class="desc" x="840" y="616">항상 켜짐 · 조명 고정</text>

  <!-- 보조 설명 -->
  <text class="desc" x="540" y="196">USB로 웹캠·Arduino에 5V 공급</text>

  <!-- 공통 GND -->
  <line class="gnd" x1="40" y1="648" x2="720" y2="648"/>
  <text class="gndt" x="380" y="642">모든 GND 공통 연결 (5V-A · 5V-B · Arduino)</text>
</svg>

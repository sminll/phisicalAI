<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0b1220; }
    .panel { fill: #0f1a2b; stroke: #1e2b40; }
    .title { fill: #e2e8f0; font-size: 15px; font-weight: 800; letter-spacing: .08em; }
    .sub { fill: #64748b; font-size: 12px; }
    .zone { fill: rgba(148, 163, 184, .045); stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .zt { fill: #cbd5e1; font-size: 13px; font-weight: 800; }
    .zd { fill: #64748b; font-size: 11.5px; }
    .zn { fill: #1e293b; stroke: #94a3b8; stroke-width: 1.5; }
    .znt { fill: #f8fafc; font-size: 11.5px; font-weight: 800; text-anchor: middle; }
    .node { fill: #111c2e; stroke-width: 2; }
    .pwr { stroke: #f59e0b; }
    .cpu { stroke: #2dd4bf; }
    .act { stroke: #a78bfa; }
    .ext { stroke: #64748b; }
    .name { fill: #f8fafc; font-size: 15.5px; font-weight: 800; text-anchor: middle; }
    .desc { fill: #94a3b8; font-size: 11.5px; text-anchor: middle; }
    .chip { font-size: 10.5px; font-weight: 800; }
    .pline { fill: none; stroke: #d97706; stroke-width: 3; stroke-linejoin: round; opacity: .9; }
    .sline { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 7 5; }
    .lbl { font-size: 11.5px; font-weight: 700; }
    .ls { fill: #5eead4; }
    .lp { fill: #fbbf24; }
    .lb { fill: #0f1a2b; }
    .gnd { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .gndt { fill: #94a3b8; font-size: 12px; text-anchor: middle; }
    .info { fill: #0f2f2c; stroke: #2dd4bf; stroke-width: 1.5; }
    .ih { fill: #f8fafc; font-size: 15px; font-weight: 800; }
    .il { fill: #cbd5e1; font-size: 12px; }
    .id { fill: #94a3b8; font-size: 11.5px; }
  </style>

  <rect class="bg" width="1160" height="820"/>
  <rect class="panel" x="16" y="56" width="1128" height="752" rx="14"/>

  <!-- 제목 · 범례 -->
  <text class="title" x="24" y="34">ECOSORT AI · MCU 개수와 부품 배치</text>
  <line x1="720" y1="30" x2="750" y2="30" stroke="#d97706" stroke-width="3"/>
  <text class="sub" x="758" y="34">전원 · 전류</text>
  <line x1="842" y1="30" x2="872" y2="30" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="sub" x="880" y="34">신호 · 데이터</text>
  <rect x="972" y="22" width="30" height="16" rx="3" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
  <text class="sub" x="1010" y="34">설치 위치 구역</text>

  <!-- ===================== 설치 구역 ===================== -->
  <rect class="zone" x="360" y="72" width="770" height="160" rx="12"/>

  <rect class="zone" x="360" y="262" width="340" height="380" rx="12"/>

  <rect class="zone" x="760" y="262" width="370" height="380" rx="12"/>

  <rect class="zone" x="36" y="480" width="290" height="210" rx="12"/>

  <!-- ===================== 전원선 ===================== -->
  <path class="pline" d="M180 728 V662"/>
  <path class="pline" d="M86 752 H54 V552 H70"/>
  <path class="pline" d="M290 552 H340 V337 H390"/>
  <path class="pline" d="M290 632 H340 V596 H390"/>
  <path class="pline" d="M670 596 H730 V176"/>
  <path class="pline" d="M730 216 H990 V176"/>
  <path class="pline" d="M730 332 H822"/>
  <path class="pline" d="M730 432 H822"/>
  <path class="pline" d="M730 532 H822"/>

  <!-- ===================== 신호선 ===================== -->
  <path class="sline" d="M490 176 V298" marker-end="url(#arr)"/>
  <path class="sline" d="M390 320 H346 V204 H180 V178" marker-end="url(#arr)"/>
  <path class="sline" d="M600 376 V468" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="sline" d="M672 488 C752 488 752 318 820 318" marker-end="url(#arr)"/>
  <path class="sline" d="M672 504 C760 504 760 418 820 418" marker-end="url(#arr)"/>
  <path class="sline" d="M820 548 C760 548 760 520 674 520" marker-end="url(#arr)"/>
  <path class="sline" d="M1060 176 V242 H690 V482 H674" marker-end="url(#arr)"/>

  <!-- ===================== 라벨 ===================== -->
  <rect class="lb" x="500" y="226" width="96" height="18" rx="4"/>
  <text class="lbl ls" x="506" y="239">USB 2.0 · UVC</text>
  <rect class="lb" x="190" y="210" width="96" height="18" rx="4"/>
  <text class="lbl ls" x="196" y="223">Wi-Fi · MQTT</text>
  <text class="lbl ls" x="590" y="414" text-anchor="end">USB 시리얼 115200bps</text>
  <text class="desc" x="590" y="432" style="text-anchor:end">D ↑ · ↓ P C G R X</text>
  <rect class="lb" x="760" y="356" width="68" height="18" rx="4"/>
  <text class="lbl ls" x="764" y="369">PWM 50Hz</text>
  <rect class="lb" x="738" y="448" width="90" height="18" rx="4"/>
  <text class="lbl ls" x="742" y="461">단일선 800kHz</text>
  <rect class="lb" x="738" y="552" width="90" height="18" rx="4"/>
  <text class="lbl ls" x="742" y="565">Trig/Echo 펄스</text>
  
  <text class="lbl ls" x="868" y="236">Trig/Echo (접근 감지)</text>
  <text class="lbl lp" x="296" y="545">5.1V 3A</text>
  <text class="lbl lp" x="296" y="625">5V 3A</text>
  <text class="lbl lp" x="738" y="210">5V-B</text>

  <!-- ===================== 노드 ===================== -->
  <!-- 카메라 팔 -->
  <rect class="node cpu" x="390" y="112" width="200" height="64" rx="10"/>
  <text class="name" x="490" y="139">USB 웹캠</text>
  <text class="desc" x="490" y="158">1280×720 · 30FPS</text>

  <rect class="node act" x="640" y="112" width="180" height="64" rx="10"/>
  <text class="name" x="730" y="139">보조 조명</text>
  <text class="desc" x="730" y="158">차광 후드 · 항상 켜짐</text>

  <rect class="node cpu" x="870" y="112" width="240" height="64" rx="10"/>
  <text class="name" x="990" y="139">초음파 HC-SR04 ×1</text>
  <text class="desc" x="990" y="158">팔 앞 끝 · 사용자 접근 감지</text>

  <!-- 전장함 -->
  <rect class="node cpu" x="390" y="300" width="280" height="76" rx="10"/>
  <text class="name" x="530" y="330">Raspberry Pi 4</text>
  <text class="desc" x="530" y="351">AI 추론 · 판단 (YOLO26n)</text>
  <rect x="404" y="308" width="58" height="18" rx="9" fill="#134e4a"/>
  <text class="chip" x="433" y="321" fill="#5eead4" text-anchor="middle">SBC 1개</text>

  <rect class="node cpu" x="390" y="470" width="280" height="76" rx="10" style="stroke-width:3"/>
  <text class="name" x="530" y="500">Arduino Uno</text>
  <text class="desc" x="530" y="521">센서 4 · 서보 3 · LED 3 모두 제어</text>
  <rect x="404" y="478" width="58" height="18" rx="9" fill="#2dd4bf"/>
  <text class="chip" x="433" y="491" fill="#0b1220" text-anchor="middle">MCU 1개</text>

  <rect class="node pwr" x="390" y="574" width="280" height="44" rx="10"/>
  <text class="name" x="530" y="601" style="font-size:14px">단자대 · 5V-B 분배</text>

  <!-- 각 투입구 -->
  <rect class="node act" x="822" y="300" width="280" height="64" rx="10"/>
  <text class="name" x="962" y="327">서보 SG90 ×3</text>
  <text class="desc" x="962" y="346">뚜껑 뒤쪽 경첩 · 뚜껑 개폐</text>

  <rect class="node act" x="822" y="400" width="280" height="64" rx="10"/>
  <text class="name" x="962" y="427">WS2812B LED ×3</text>
  <text class="desc" x="962" y="446">뚜껑 앞 가장자리 · 색 안내</text>

  <rect class="node cpu" x="822" y="500" width="280" height="64" rx="10"/>
  <text class="name" x="962" y="527">초음파 HC-SR04 ×3</text>
  <text class="desc" x="962" y="546">상판 아래 · 쓰레기 높이 측정</text>

  <text class="desc" x="962" y="604">한 칸에 서보 1 · LED 1 · 적재 센서 1</text>
  <text class="desc" x="962" y="622">→ 3칸 모두 같은 구조</text>

  <!-- 뒤쪽 아래 -->
  <rect class="node pwr" x="70" y="522" width="220" height="60" rx="10"/>
  <text class="name" x="180" y="548">어댑터 5.1V/3A</text>
  <text class="desc" x="180" y="567">5V-A · Pi 전용 USB-C</text>

  <rect class="node pwr" x="70" y="602" width="220" height="60" rx="10"/>
  <text class="name" x="180" y="628">어댑터 5V/3A</text>
  <text class="desc" x="180" y="647">5V-B · 구동부 전용</text>

  <!-- 외부 -->
  <rect class="node ext" x="86" y="728" width="188" height="50" rx="10"/>
  <text class="name" x="180" y="752" style="font-size:14px">AC 220V 콘센트</text>
  <text class="desc" x="180" y="769">고정 설치</text>

  <rect class="node ext" x="40" y="112" width="280" height="64" rx="10"/>
  <text class="name" x="180" y="139">교내 관리 서버</text>
  <text class="desc" x="180" y="158">결과 텍스트만 · 사진 X</text>

  <!-- MCU 개수 설명 -->
  <rect class="info" x="40" y="250" width="280" height="206" rx="12"/>
  <text class="ih" x="56" y="278">MCU 1개 + SBC 1개</text>
  <text class="il" x="56" y="304">MCU 하나로 충분한 이유</text>
  <text class="id" x="56" y="328">· 모든 부품이 1m 안, 한 상자에 모여 있음</text>
  <text class="id" x="56" y="350">· 핀 18개 중 12개만 사용 (여유 있음)</text>
  <text class="id" x="56" y="372">· "뚜껑은 하나씩", "손 있으면 안 닫음"</text>
  <text class="id" x="66" y="392">규칙은 한 MCU가 전체를 봐야 판단 가능</text>
  <text class="il" x="56" y="420">MCU를 늘리는 경우</text>
  <text class="id" x="56" y="442">· 칸이 1~2m 이상 떨어지거나 핀이 부족할 때</text>

  <!-- 공통 GND -->
  <line class="gnd" x1="340" y1="760" x2="1128" y2="760"/>
  <text class="gndt" x="734" y="752">모든 GND 공통 연결 (5V-A · 5V-B · Arduino · 단자대)</text>
  <!-- 구역 라벨 (선 위에 보이도록 마지막에 그림) -->
  <rect x="366" y="80" width="420" height="24" rx="6" fill="#0f1a2b"/>
  <rect x="366" y="270" width="290" height="24" rx="6" fill="#0f1a2b"/>
  <rect x="766" y="270" width="360" height="24" rx="6" fill="#0f1a2b"/>
  <rect x="42" y="488" width="278" height="24" rx="6" fill="#0f1a2b"/>
  <circle class="zn" cx="380" cy="92" r="11"/><text class="znt" x="380" y="96">2</text>
  <text class="zt" x="398" y="97">카메라 팔</text>
  <text class="zd" x="470" y="97">인식 영역 약 30cm 위 · 아래를 향해 설치</text>
  <circle class="zn" cx="380" cy="282" r="11"/><text class="znt" x="380" y="286">1</text>
  <text class="zt" x="398" y="287">전장함</text>
  <text class="zd" x="452" y="287">뒤쪽 위 · 음료가 안 튀는 곳</text>
  <circle class="zn" cx="780" cy="282" r="11"/><text class="znt" x="780" y="286">3</text>
  <text class="zt" x="798" y="287">각 투입구</text>
  <text class="zd" x="866" y="287">칸마다 1세트 × 3 (페트병 · 캔 · 일반)</text>
  <circle class="zn" cx="56" cy="500" r="11"/><text class="znt" x="56" y="504">4</text>
  <text class="zt" x="74" y="505">뒤쪽 아래</text>
  <text class="zd" x="142" y="505">무게 중심 낮게 · 전원선 뒤로</text>
</svg>

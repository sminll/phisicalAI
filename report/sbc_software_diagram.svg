<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" width="1160" height="900" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0b1220; }
    .title { fill: #e2e8f0; font-size: 15px; font-weight: 800; letter-spacing: .06em; }
    .sub { fill: #64748b; font-size: 12px; }
    .pi { fill: #0f1a2b; stroke: #2dd4bf; stroke-width: 2; }
    .pit { fill: #5eead4; font-size: 14px; font-weight: 800; }
    .dev { fill: #111c2e; stroke: #64748b; stroke-width: 1.5; }
    .ctr { fill: #111c2e; stroke-width: 2; }
    .c-dev { stroke: #f59e0b; }
    .c-core { stroke: #2dd4bf; }
    .c-soft { stroke: #a78bfa; }
    .n { fill: #f8fafc; font-size: 15px; font-weight: 800; }
    .t { fill: #cbd5e1; font-size: 12px; }
    .d { fill: #94a3b8; font-size: 11.5px; }
    .dc { fill: #f8fafc; font-size: 13.5px; font-weight: 800; text-anchor: middle; }
    .dd { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
    .sl { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 7 5; }
    .gl { fill: none; stroke: #94a3b8; stroke-width: 1.8; }
    .lbl { font-size: 11.5px; font-weight: 700; }
    .lt { fill: #5eead4; }
    .lg { fill: #cbd5e1; }
    .lb { fill: #0f1a2b; }
    .zone-h { font-size: 13px; font-weight: 800; }
    .zone-d { fill: #94a3b8; font-size: 11.5px; }
    .badge { font-size: 10.5px; font-weight: 800; }
  </style>

  <rect class="bg" width="1160" height="900"/>
  <text class="title" x="24" y="34">ECOSORT AI · SBC 내부 소프트웨어 구조</text>
  <text class="sub" x="1136" y="34" text-anchor="end">점선 = MQTT 메시지 · 실선 = 장치 연결</text>

  <!-- ===== Pi 밖의 장치 ===== -->
  <rect class="dev" x="80" y="56" width="240" height="56" rx="10"/>
  <text class="dc" x="200" y="80">USB 웹캠</text>
  <text class="dd" x="200" y="98">1280×720 · 위에서 아래로</text>

  <rect class="dev" x="430" y="56" width="400" height="56" rx="10" style="stroke:#2dd4bf"/>
  <text class="dc" x="630" y="80">Arduino Uno (MCU)</text>
  <text class="dd" x="630" y="98">센서 · 서보 · LED + 안전 규칙 (Pi가 죽어도 뚜껑을 닫음)</text>

  <rect class="dev" x="880" y="56" width="240" height="56" rx="10"/>
  <text class="dc" x="1000" y="80">교내 관리 서버</text>
  <text class="dd" x="1000" y="98">결과 텍스트만 · 사진 X</text>

  <!-- ===== Raspberry Pi 4 ===== -->
  <rect class="pi" x="40" y="150" width="1080" height="720" rx="14"/>
  <text class="pit" x="60" y="176">Raspberry Pi 4 (4GB) · Raspberry Pi OS 64-bit + Docker Engine</text>
  <text class="d" x="230" y="198">연결 장치: 웹캠 · Arduino · Wi-Fi · microSD</text>

  <!-- 장치 연결선 -->
  <path class="gl" d="M200 112 V228" marker-end="url(#ag)"/>
  <rect class="lb" x="208" y="150" width="120" height="0"/>
  <text class="lbl lg" x="210" y="216">--device /dev/video0</text>
  <path class="gl" d="M630 112 V228" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text class="lbl lg" x="640" y="216">--device /dev/ttyACM0 · 115200bps</text>
  <path class="gl" d="M836 640 H860 V140 H1000 V112" marker-end="url(#ag)"/>
  <text class="lbl lg" x="868" y="134">Wi-Fi · MQTT</text>

  <!-- ===== ① camera-collector ===== -->
  <rect class="ctr c-dev" x="70" y="230" width="350" height="140" rx="10"/>
  <text class="n" x="88" y="258">① camera-collector</text>
  <text class="t" x="88" y="282">Python 3.11 + OpenCV</text>
  <text class="t" x="88" y="304">역할: 접근 신호가 오면 5장 촬영 → 보내기</text>
  <text class="d" x="88" y="326">카메라만 접근 (--device) · 사진은 저장하지 않음</text>
  <text class="d" x="88" y="346">sub: sensor/approach  ·  pub: camera/frames</text>

  <!-- ===== ② arduino-bridge ===== -->
  <rect class="ctr c-dev" x="460" y="230" width="380" height="140" rx="10"/>
  <text class="n" x="478" y="258">② arduino-bridge</text>
  <text class="t" x="478" y="282">Python 3.11 + pyserial</text>
  <text class="t" x="478" y="304">역할: Arduino ↔ MQTT 번역 (D · P C G R X)</text>
  <text class="d" x="478" y="326">시리얼 포트만 접근 (--device)</text>
  <text class="d" x="478" y="346">pub: sensor/approach, sensor/fill  ·  sub: cmd/bin</text>

  <!-- ===== ③ broker ===== -->
  <rect class="ctr c-core" x="70" y="430" width="770" height="80" rx="10"/>
  <text class="n" x="88" y="460">③ broker   Mosquitto MQTT</text>
  <text class="t" x="88" y="484">컨테이너끼리 메시지를 전달하는 우체국 · 장치 안에서만 사용 (외부 포트 닫음) · 권한 없음 · 자원 거의 안 씀</text>

  <!-- ===== ④ ai-inference ===== -->
  <rect class="ctr c-soft" x="70" y="570" width="350" height="150" rx="10"/>
  <text class="n" x="88" y="598">④ ai-inference</text>
  <text class="t" x="88" y="622">Python 3.11 + Ultralytics + NCNN</text>
  <text class="t" x="88" y="644">역할: 선명한 1장 → YOLO26n → 판단 규칙</text>
  <text class="d" x="88" y="666">권한 없음 · mem_limit 1.5GB</text>
  <text class="d" x="88" y="686">sub: camera/frames</text>
  <text class="d" x="88" y="706">pub: cmd/bin, result/log</text>

  <!-- ===== ⑤ log-uploader ===== -->
  <rect class="ctr c-soft" x="460" y="570" width="380" height="150" rx="10"/>
  <text class="n" x="478" y="598">⑤ log-uploader</text>
  <text class="t" x="478" y="622">Python 3.11 + SQLite</text>
  <text class="t" x="478" y="644">역할: 결과 텍스트 저장 → 서버로 전송</text>
  <text class="d" x="478" y="666">권한 없음 · Wi-Fi가 끊기면 쌓았다가 재전송</text>
  <text class="d" x="478" y="686">sub: result/log, sensor/fill</text>
  <text class="d" x="478" y="706">microSD 볼륨 (/data)</text>

  <!-- ===== MQTT 화살표 ===== -->
  <path class="sl" d="M180 370 V428" marker-end="url(#a)"/>
  <text class="lbl lt" x="150" y="402" text-anchor="end">camera/frames</text>
  <path class="sl" d="M320 428 V372" marker-end="url(#a)"/>
  <text class="lbl lt" x="330" y="402">sensor/approach</text>

  <path class="sl" d="M540 370 V428" marker-end="url(#a)"/>
  <text class="lbl lt" x="530" y="402" text-anchor="end">sensor/*</text>
  <path class="sl" d="M760 428 V372" marker-end="url(#a)"/>
  <text class="lbl lt" x="770" y="402">cmd/bin</text>

  <path class="sl" d="M180 510 V568" marker-end="url(#a)"/>
  <text class="lbl lt" x="170" y="544" text-anchor="end">camera/frames</text>
  <path class="sl" d="M320 568 V512" marker-end="url(#a)"/>
  <text class="lbl lt" x="330" y="544">cmd/bin · result/log</text>

  <path class="sl" d="M650 510 V568" marker-end="url(#a)"/>
  <text class="lbl lt" x="660" y="544">result/log · sensor/fill</text>

  <!-- ===== 오른쪽 구역 설명 ===== -->
  <rect x="884" y="230" width="220" height="140" rx="10" fill="rgba(245,158,11,.08)" stroke="#f59e0b" stroke-dasharray="5 5"/>
  <text class="zone-h" x="900" y="256" fill="#fbbf24">장치 접근 구역</text>
  <text class="zone-d" x="900" y="280">필요한 장치 하나만 연결</text>
  <text class="zone-d" x="900" y="298">(privileged 대신 --device)</text>
  <text class="zone-d" x="900" y="322">restart: always</text>
  <text class="zone-d" x="900" y="340">꺼지면 바로 다시 켜짐</text>

  <rect x="884" y="430" width="220" height="80" rx="10" fill="rgba(45,212,191,.08)" stroke="#2dd4bf" stroke-dasharray="5 5"/>
  <text class="zone-h" x="900" y="456" fill="#5eead4">시스템의 척추</text>
  <text class="zone-d" x="900" y="478">restart: always</text>
  <text class="zone-d" x="900" y="496">모든 메시지가 지나가는 길</text>

  <rect x="884" y="570" width="220" height="150" rx="10" fill="rgba(167,139,250,.08)" stroke="#a78bfa" stroke-dasharray="5 5"/>
  <text class="zone-h" x="900" y="596" fill="#c4b5fd">죽어도 되는 구역</text>
  <text class="zone-d" x="900" y="620">권한 없음 · 메모리 한도</text>
  <text class="zone-d" x="900" y="638">restart: on-failure</text>
  <text class="zone-d" x="900" y="662">AI가 메모리 초과로 죽어도</text>
  <text class="zone-d" x="900" y="680">①②③⑤는 계속 동작하고</text>
  <text class="zone-d" x="900" y="698">④만 다시 켜짐</text>

  <!-- ===== 아래: 안전 흐름 ===== -->
  <rect x="70" y="756" width="1034" height="92" rx="10" fill="#0b1626" stroke="#1e2b40"/>
  <text class="zone-h" x="88" y="782" fill="#e2e8f0">한 번의 동작 흐름</text>
  <text class="t" x="88" y="806">Arduino 접근 감지(D) → ② → sensor/approach → ① 5장 촬영 → camera/frames → ④ 판별 → cmd/bin → ② → Arduino 뚜껑·LED</text>
  <text class="d" x="88" y="830">이중 안전: ④가 답을 못 하면 Arduino가 5초 뒤 대기로 돌아가고, ②가 끊겨 Pi 통신이 3초 없으면 Arduino가 스스로 뚜껑을 닫음</text>
</svg>
